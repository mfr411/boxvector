{{define "body"}}<form class="login" method="post" action="/login">
<h1 class="brand"><svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 10 L85 30 V70 L50 90 L15 70 V30 Z"/><path d="M15 30 L50 50 L85 30 M50 50 V90" fill="none" stroke="#fff" stroke-width="4"/><path d="M60 58 L72 66 L60 75" fill="none" stroke="#fff" stroke-width="6"/></svg>Boxvector</h1>
{{with .Data}}<p class="err">{{.}}</p>{{end}}
<label>User<input name="user" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="pri">Sign in</button>
</form>{{end}}
