{{define "body"}}{{with .Data}}
<div class="bar"><h2>Comment route</h2></div>
{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
<form class="frm" method="post" action="/routes/comment"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="prefix" value="{{.Prefix}}">
<label class="w">Comment for <b>{{.Prefix}}</b><input name="comment" value="{{.Comment}}" maxlength="80" autocomplete="off" placeholder="empty removes the comment"></label>
<div class="w act"><a class="btn" href="/routes">Cancel</a><button class="pri">Review</button></div>
</form>
{{end}}{{end}}
