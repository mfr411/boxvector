{{define "body"}}{{with .Data}}
<div class="bar"><h2>{{.Title}}</h2></div>
{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
<form class="frm" method="post" action="/routes/act"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="prefix" value="{{.Prefix}}"><input type="hidden" name="do" value="{{.Do}}">
<p class="w">{{.Text}} <b>{{.Prefix}}</b>? The next step shows the diff and a dry-run; nothing changes until you press Apply.</p>
<div class="w act"><a class="btn" href="/routes">Cancel</a><button class="pri{{if .Danger}} dng{{end}}">Review</button></div>
</form>
{{end}}{{end}}
