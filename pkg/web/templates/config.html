{{define "body"}}{{with .Data}}
{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
<div class="cols">
<form class="grow" method="post" action="/config/review"><input type="hidden" name="csrf" value="{{$.CSRF}}">
<div class="bar"><h2>Config</h2><span class="s mono hm">{{.File}}</span><button class="pri">Review changes</button></div>
<textarea name="text" class="code" spellcheck="false" rows="32">{{.Text}}</textarea>
</form>
<aside><h3>Snapshots</h3>
{{range .Snaps}}<form method="post" action="/config/restore"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="snap" value="{{.}}"><button class="link mono">{{.}}</button></form>
{{else}}<p class="s">None yet. A snapshot is taken before every apply.</p>{{end}}
</aside></div>
{{end}}{{end}}
