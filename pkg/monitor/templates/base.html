{{define "head"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>boxvector monitor</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23111' d='M50 10 L85 30 V70 L50 90 L15 70 V30 Z'/%3E%3Cpath d='M15 30 L50 50 L85 30 M50 50 V90' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M60 58 L72 66 L60 75' fill='none' stroke='%23fff' stroke-width='6'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e9ecf1;color:#1f2430}
a{color:#2a5fd6;text-decoration:none}a:hover{text-decoration:underline}
.top{background:#fff;border-bottom:1px solid #cfd5df;min-height:38px;display:flex;align-items:center;padding:0 14px;gap:18px;flex-wrap:wrap}.top b,.top a{white-space:nowrap}
.brand{display:flex;align-items:center;gap:7px;color:#111;text-decoration:none!important}.brand .lg{width:22px;height:22px}.brand b{font-weight:600;letter-spacing:-.3px;font-size:15px}.brand span{color:#6b7280;font-size:13px;padding-left:7px;border-left:1px solid #cfd5df}.top nav{display:flex;gap:4px;flex:1}
.top nav a{padding:5px 10px;border-radius:3px;color:#4a5262}.top nav a.on{background:#e6ecf8;color:#1f3f8f}
.top form{margin:0}.wrap{max-width:1180px;margin:14px auto;padding:0 14px}
.card{background:#fff;border:1px solid #cfd5df;border-radius:3px;margin-bottom:14px}
.card h2{margin:0;padding:7px 12px;font-size:12px;font-weight:600;color:#4a5262;background:#f4f6fa;border-bottom:1px solid #cfd5df}
.in{padding:10px 12px}.sum{display:flex;flex-wrap:wrap;gap:12px 26px;padding:10px 12px}.sum div span{display:block;font-size:11px;color:#6b7280}.sum div b{font-size:18px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 12px;border-bottom:1px solid #eceff4;white-space:nowrap}
th{font-size:11px;font-weight:600;color:#6b7280;background:#fafbfd}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aab1bf}.dot.on{background:#2f9e5b}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:#eef1f6;color:#4a5262}.tag.ok{background:#e4f4ea;color:#1f6b3d}.tag.failed,.tag.rolledback{background:#fbe7e5;color:#a02a22}.tag.queued,.tag.running{background:#e6ecf8;color:#1f3f8f}
button,.btn{font:inherit;padding:4px 12px;border:1px solid #b9c1ce;border-radius:3px;background:#f7f8fb;color:#1f2430;cursor:pointer}button:hover{background:#eef1f7}button:disabled{color:#aab1bf;cursor:default}
input[type=text],input[type=password],input[type=file],select,textarea{font:inherit;padding:4px 7px;border:1px solid #b9c1ce;border-radius:3px;background:#fff}
.msg{background:#e6ecf8;border:1px solid #c3d0ee;color:#1f3f8f;padding:6px 12px;border-radius:3px;margin-bottom:14px}.err{color:#a02a22}.s{color:#6b7280;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #eceff4}.bar .s{flex:1 1 100%}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:10px 12px}.kv span{color:#6b7280}
pre{margin:0;padding:8px 12px;background:#f4f6fa;font:12px ui-monospace,Menlo,monospace;overflow:auto}
.login{max-width:300px;width:calc(100% - 28px);margin:12vh auto}.login input{width:100%;margin:4px 0 10px}

@media(max-width:700px){
body{font-size:13px}.wrap{margin:10px auto;padding:0 10px}.top{gap:6px 14px;padding:6px 10px}.top nav{order:3;flex:1 1 100%;overflow-x:auto}.top nav a{padding:8px 12px}
.top form{margin-left:auto}.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.sum div b{font-size:16px;word-break:break-all}.sum div:last-child:nth-child(odd){grid-column:1/-1}
.bar>*{flex:1 1 auto}.bar select,.bar input[type=text],.bar input[type=file]{flex:1 1 100%;width:100%;min-width:0}.bar button{padding:9px 12px;flex:1 1 40%}
.bar input[type=text]{width:100%!important}
input[type=checkbox]{width:20px;height:20px}
table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}table.rs tr:first-child:has(th){display:none}
table.rs tr{padding:8px 12px;border-bottom:1px solid #eceff4;position:relative}table.rs td{border:0;padding:2px 0;white-space:normal;display:flex;gap:10px}
table.rs td[data-l]::before{content:attr(data-l);flex:0 0 78px;color:#6b7280;font-size:12px}
table.rs td.chk{position:absolute;right:10px;top:8px;width:auto}table.rs td.nm{font-weight:600;font-size:15px}
table.rs td[colspan]{display:block}
.kv{grid-template-columns:1fr;gap:0 12px}.kv span{margin-top:6px;font-size:12px}
td,th{padding:6px 10px}table.ev,table.ev tbody,table.ev tr,table.ev td{display:block;width:100%}table.ev tr{padding:6px 12px;border-bottom:1px solid #eceff4}table.ev td{border:0;padding:0;white-space:normal;font-size:12px;line-height:1.4;word-break:break-word}table.ev td.s{font-size:11px}pre{white-space:pre-wrap;word-break:break-all}
}
</style></head><body>{{end}}
{{define "nav"}}<div class="top"><a class="brand" href="/"><svg class="lg" viewBox="0 0 100 100" aria-hidden="true"><path fill="#111" d="M50 10 L85 30 V70 L50 90 L15 70 V30 Z"/><path d="M15 30 L50 50 L85 30 M50 50 V90" fill="none" stroke="#fff" stroke-width="4"/><path d="M60 58 L72 66 L60 75" fill="none" stroke="#fff" stroke-width="6"/></svg><b>boxvector</b><span>monitor</span></a><nav><a href="/" class="{{if eq . "devices"}}on{{end}}">Devices</a><a href="/releases" class="{{if eq . "releases"}}on{{end}}">Releases</a><a href="/enroll" class="{{if eq . "enroll"}}on{{end}}">Enroll</a><a href="/account" class="{{if eq . "account"}}on{{end}}">Account</a></nav><form method="post" action="/logout"><a href="/logout">Sign out</a></form></div><div class="wrap">{{end}}
{{define "foot"}}</div></body></html>{{end}}
