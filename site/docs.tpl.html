<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · boxvector docs</title>
<meta name="description" content="boxvector documentation: {{TITLE}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fff;--soft:#f6f7f9;--fg:#15171a;--mu:#5c6370;--ln:#e4e6eb;--ac:#2f4ea2;--code:#101319}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.w{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}
header .w{display:flex;align-items:center;height:56px;gap:28px}
.brand{display:flex;align-items:center;gap:9px;color:var(--fg);font-weight:600;font-size:17px;letter-spacing:-.3px}.brand:hover{text-decoration:none}
.brand img{width:24px;height:24px}
nav{margin-left:auto;display:flex;gap:22px;font-size:14px}nav a{color:var(--mu)}nav a:hover{color:var(--fg);text-decoration:none}
.hero{padding:84px 0 56px;text-align:left}
.hero h1{font-size:46px;line-height:1.12;letter-spacing:-1.4px;margin:0 0 18px;font-weight:650;max-width:760px}
.hero p.lead{font-size:19px;color:var(--mu);max-width:640px;margin:0 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 18px;border:1px solid var(--ln);border-radius:7px;color:var(--fg);font-size:15px;background:#fff;transition:border-color .15s,background .15s}
.btn:hover{border-color:#b9bfcc;background:var(--soft);text-decoration:none}.btn.p{border-color:var(--fg)}
.shot{margin-top:52px;border:1px solid var(--ln);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(20,30,60,.07)}
.shot img{display:block;width:100%;height:auto}
section{padding:72px 0;border-top:1px solid var(--ln)}
section.soft{background:var(--soft)}
h2{font-size:30px;letter-spacing:-.8px;margin:0 0 10px;font-weight:650}
.sub{color:var(--mu);margin:0 0 38px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
.grid h3{font-size:16px;margin:0 0 6px;font-weight:600}.grid p{margin:0;color:var(--mu);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
pre{margin:0;background:var(--code);color:#d7dbe4;border-radius:9px;padding:18px 20px;overflow:auto;font:13.5px/1.6 "JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace}
pre .k{color:#8fb0ff}pre .c{color:#7c8596}pre .s{color:#a6d8a0}
code{font:13.5px "JetBrains Mono",Consolas,monospace;background:#eceef2;padding:1px 6px;border-radius:4px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:22px}
.steps li{counter-increment:s;padding-left:46px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--mu);background:#fff}
.steps b{display:block;font-weight:600}.steps span{color:var(--mu);font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--ln);border-radius:7px;background:#fff;color:var(--mu);cursor:pointer;transition:all .15s}
.tabs button.on{color:var(--fg);border-color:#9aa3b8;background:#fff}
.pane{display:none}.pane.on{display:block;animation:f .25s}@keyframes f{from{opacity:0}to{opacity:1}}
.pane p{color:var(--mu);margin:14px 0 0;max-width:640px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--ln)}th{font-weight:600;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
footer{border-top:1px solid var(--ln);padding:34px 0;color:var(--mu);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:820px){.hero{padding:52px 0 36px}.hero h1{font-size:32px;letter-spacing:-1px}.hero p.lead{font-size:17px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}nav a:not(:last-child){display:none}section{padding:52px 0}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

.doc{display:grid;grid-template-columns:210px minmax(0,1fr) 190px;gap:44px;padding:36px 0 80px}
.side,.toc{position:sticky;top:76px;align-self:start;font-size:14px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.side a,.toc a{color:var(--mu);padding:5px 10px;border-radius:6px}.side a:hover,.toc a:hover{color:var(--fg);background:var(--soft);text-decoration:none}
.side a.on{color:var(--fg);background:var(--soft);font-weight:600}
.toc b{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);padding:5px 10px}
.toc a{padding:3px 10px;font-size:13px}
article{min-width:0}article h1{font-size:34px;letter-spacing:-1px;margin:0 0 14px}
article h2{font-size:24px;margin:44px 0 12px;padding-top:22px;border-top:1px solid var(--ln)}article h3{font-size:18px;margin:30px 0 8px}article h4{font-size:15px;margin:22px 0 6px}
article p,article li{max-width:760px}article ul,article ol{padding-left:22px}
article blockquote{margin:16px 0;padding:2px 16px;border-left:3px solid var(--ln);color:var(--mu);background:var(--soft);border-radius:0 6px 6px 0}
article pre{margin:14px 0;position:relative}article pre code{background:none;padding:0;color:inherit;font-size:13.5px}
.hl{margin-left:8px;color:var(--ln);font-weight:400;opacity:0}h1:hover .hl,h2:hover .hl,h3:hover .hl,h4:hover .hl{opacity:1;color:var(--mu);text-decoration:none}
.tw{overflow:auto;margin:14px 0}article table{table-layout:fixed}article th:nth-child(1){width:26%}article td{word-break:break-word}.toc a.on{color:var(--fg);font-weight:600}.side hr{border:0;border-top:1px solid var(--ln);margin:8px 0}
details{margin:14px 0;border:1px solid var(--ln);border-radius:8px;padding:2px 14px}summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:15px}
.cp{position:absolute;top:8px;right:8px;font:12px inherit;font-family:inherit;color:#aab1c0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:2px 9px;cursor:pointer}.cp:hover{color:#fff}
li.ck{list-style:none;margin-left:-20px}input[type=checkbox]{margin-right:6px}
.srch{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--ln);border-radius:7px;margin-bottom:10px;background:#fff}
@media(max-width:1020px){.doc{grid-template-columns:190px minmax(0,1fr)}.toc{display:none}}
@media(max-width:720px){.doc{grid-template-columns:1fr;gap:16px}.side{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
</style>
</head>
<body>
<header><div class="w">
  <a class="brand" href="/"><img src="/img/boxvector-mark.svg" alt="">boxvector</a>
  <nav><a href="/#features">Features</a><a href="/#install">Install</a><a href="/docs/">Docs</a><a href="https://github.com/mfr411/boxvector">GitHub</a></nav>
</div></header>
<main><div class="w doc">
  <aside class="side"><input class="srch" id="q" type="search" placeholder="Filter this page" aria-label="Filter this page">{{NAV}}</aside>
  <article id="a">{{BODY}}<p style="margin-top:48px;font-size:14px"><a href="{{EDIT}}">Suggest an edit on GitHub</a></p></article>
  <aside class="toc"><b>On this page</b>{{TOC}}</aside>
</div></main>
<footer><div class="w">
  <div><b style="color:var(--fg)">boxvector</b> · docs are built from the repository on every push</div>
  <div>Powered by <a href="https://www.nexcolo.com/" rel="noopener">Nexcolo</a> · Inspired by <a href="https://github.com/natesales/pathvector" rel="noopener">Pathvector</a></div>
</div></footer>
<script>
(function(){
document.querySelectorAll('pre[data-copy]').forEach(function(p){
  var b=document.createElement('button');b.className='cp';b.type='button';b.textContent='Copy';
  b.onclick=function(){navigator.clipboard.writeText(p.innerText.replace(/\nCopy$/,'')).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1200)})};
  p.appendChild(b)});
var q=document.getElementById('q'),a=document.getElementById('a');
q.addEventListener('input',function(){var v=q.value.toLowerCase();
  a.querySelectorAll('h2').forEach(function(h){var sec=[h],n=h.nextElementSibling;while(n&&n.tagName!=='H2'){sec.push(n);n=n.nextElementSibling}
    var hit=!v||sec.some(function(e){return e.textContent.toLowerCase().indexOf(v)>-1});sec.forEach(function(e){e.style.display=hit?'':'none'})})});
var tl=[].slice.call(document.querySelectorAll(".toc a")),hs=tl.map(function(x){return document.getElementById(x.getAttribute("href").slice(1))});
function sp(){var y=scrollY+90,c=-1;hs.forEach(function(h,i){if(h&&h.offsetTop<=y)c=i});tl.forEach(function(x,i){x.classList.toggle("on",i===c)})}
addEventListener("scroll",sp,{passive:true});sp();
})();
</script>
</body>
</html>
