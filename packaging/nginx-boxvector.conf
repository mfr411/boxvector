# Reverse proxy with TLS in front of "boxvector web" (listening on 127.0.0.1:8180).
# Start it with --trust-proxy so client IPs (login rate limit) and the Secure
# cookie flag come from the headers below. Restrict access to your NOC ranges.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rs1.example.net;

    ssl_certificate     /etc/letsencrypt/live/rs1.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rs1.example.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # allow 192.0.2.0/24;    # NOC / VPN
    # allow 2001:db8::/48;
    # deny all;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client input
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;                         # apply may run bgpq4 / PeeringDB
    }
}
