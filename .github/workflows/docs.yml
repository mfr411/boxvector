name: Docs

# Keeps README.md (CLI block), docs/cli.md and docs/configuration.md in sync
# with the code: regenerate on every push to dev and commit if anything changed.
on:
  push:
    branches: [dev]
    paths: ["**.go", "go.mod", "README.md", "docs/generate.sh"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docs/generate.sh
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "docs up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git commit -m "docs: regenerate from code [skip ci]"
          git push
